name: Deploy to Alibaba Cloud

on:
  push:
    branches: [feature-demo]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf 'Host ride-ops-production\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" >> ~/.ssh/config

      - name: Deploy application
        run: |
          ssh ride-ops-production 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR=/opt/ride-ops
          APP_USER=rideops
          BRANCH=feature-demo

          # 部署通过 root 登录，但代码目录由 rideops 持有；显式信任该固定目录。
          git config --global --add safe.directory "$APP_DIR"
          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          chown -R "$APP_USER:$APP_USER" "$APP_DIR"

          # 前端仍由宿主机 Nginx 托管，因此在宿主机构建静态文件。
          sudo -u "$APP_USER" -H bash -lc '
            set -euo pipefail
            cd /opt/ride-ops
            cd frontend
            npm ci
            npm run build
          '

          # 后端改由 Docker Compose 托管。首次迁移时停用旧的 systemd 服务，
          # 防止它与容器争用 127.0.0.1:8001。
          systemctl disable --now ride-ops-api || true
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          for attempt in {1..15}; do
            if [ "$(docker inspect -f '{{.State.Running}}' ride-ops-api 2>/dev/null || true)" = "true" ] \
              && curl --fail --silent http://127.0.0.1:8001/docs >/dev/null 2>&1; then
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy within 30 seconds."
          docker compose -f docker-compose.prod.yml ps || true
          docker compose -f docker-compose.prod.yml logs --tail=100 api || true
          exit 1
          REMOTE_SCRIPT
