[project]
name = "study-raw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nzdmlm", email = "1546521816@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.3.2",
    "fastapi>=0.141.1",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "notebook>=7.6.1",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
study-raw = "study_raw:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
