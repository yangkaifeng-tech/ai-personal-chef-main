services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ride-ops-api
    restart: unless-stopped

    # PostgreSQL and Nginx still run on the server host. Host networking lets
    # the existing localhost database URLs in .env keep working unchanged.
    network_mode: host

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
