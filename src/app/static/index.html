<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ed">
  <meta name="description" content="上传食材照片或输入现有食材，让 AI 私厨为你推荐简单好吃的菜谱。">
  <title>灶边 · AI 私厨</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner glass">
      <a class="brand" href="/" aria-label="灶边 AI 私厨首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M17 21H7a1 1 0 0 1-1-1v-5.3a4 4 0 0 1 1.5-7.7A5 5 0 0 1 17 7a4 4 0 0 1 1 7.7V20a1 1 0 0 1-1 1Z"/><path d="M6 17h12"/></svg>
        </span>
        <span>
          <strong>灶边</strong>
          <small>你的 AI 私厨</small>
        </span>
      </a>
      <div class="header-copy" id="connectionStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>看食材，想菜谱，今晚吃得更简单</span>
      </div>
      <button class="secondary-btn" id="newSessionBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>新对话</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <section class="conversation glass" aria-label="与 AI 私厨的对话">
      <div class="messages" id="messages" aria-live="polite" aria-busy="false">
        <div class="welcome" id="welcome">
          <div class="welcome-icon" aria-hidden="true">🥘</div>
          <p class="eyebrow">从冰箱里现有的食材开始</p>
          <h1>今天，想做点什么？</h1>
          <p class="welcome-copy">拍一张食材照片，或直接告诉我你有什么。还可以补充用餐人数、时间和口味。</p>
          <div class="suggestions" aria-label="快捷提问">
            <button class="suggestion" type="button">🥚 鸡蛋和番茄，10 分钟搞定</button>
            <button class="suggestion" type="button">🥦 推荐一道低脂晚餐</button>
            <button class="suggestion" type="button">🍚 用剩米饭做点新花样</button>
          </div>
          <div class="tips">
            <span><b>1</b> 上传或描述食材</span>
            <i aria-hidden="true"></i>
            <span><b>2</b> AI 分析搭配</span>
            <i aria-hidden="true"></i>
            <span><b>3</b> 获得具体做法</span>
          </div>
        </div>
      </div>
      <button class="scroll-latest" id="scrollLatestBtn" type="button" hidden aria-label="回到最新消息">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        最新消息
      </button>

      <div class="composer-wrap">
        <div class="drop-hint" id="dropHint" aria-hidden="true">
          <span>📷</span><strong>松开即可添加食材图片</strong>
        </div>
        <div class="preview" id="preview" hidden>
          <img id="previewImage" alt="待上传的食材图片预览">
          <div><strong id="previewName"></strong><span>已选择，发送后开始识别</span></div>
          <button id="removeImageBtn" class="icon-btn" type="button" aria-label="移除已选择的图片">×</button>
        </div>
        <form class="composer" id="composer">
          <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <button class="icon-btn upload-btn" id="uploadBtn" type="button" aria-label="选择食材图片" title="选择食材图片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L5 21"/></svg>
          </button>
          <label class="sr-only" for="messageInput">描述已有食材</label>
          <textarea id="messageInput" rows="1" maxlength="1000" placeholder="例如：鸡蛋、番茄和一点米饭，想做一人份晚餐…"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" disabled aria-label="发送消息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg>
          </button>
        </form>
        <div class="composer-meta">
          <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行 · 支持粘贴图片</span>
          <span class="char-count" id="charCount">0 / 1000</span>
          <button id="cancelBtn" type="button" hidden>停止生成</button>
        </div>
      </div>
    </section>
  </main>

  <dialog class="confirm-dialog" id="newSessionDialog">
    <div class="dialog-icon" aria-hidden="true">🍽️</div>
    <h2>开始一段新对话？</h2>
    <p>当前对话记录会被清空，这个操作无法撤销。</p>
    <div class="dialog-actions">
      <button class="dialog-cancel" id="cancelNewSessionBtn" type="button">继续当前对话</button>
      <button class="dialog-confirm" id="confirmNewSessionBtn" type="button">清空并新建</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
